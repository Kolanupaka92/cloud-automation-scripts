---
# Create a complete, policy-compliant Azure application stack from one spec:
# resource group, network, storage, key vault, and VMs.
#
#   ansible-playbook azure_resource_stack.yml -e @stacks/payments-prod.yml --check
#   ansible-playbook azure_resource_stack.yml -e @stacks/payments-prod.yml
#   ansible-playbook azure_resource_stack.yml -e @stacks/payments-prod.yml -e state=absent
#
# Building these by hand — or by copying last project's portal clicks — is how
# an estate ends up with public blob containers, storage accounts allowing TLS
# 1.0, VMs with public IPs "just for troubleshooting", and no diagnostic
# settings anywhere. Every default here is the safe one, and the unsafe options
# require an explicit override that is visible in the spec file and therefore in
# code review.
#
# Requires: ansible-galaxy collection install azure.azcollection
#           pip install -r ../../requirements.txt

- name: Provision an Azure application stack
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    state: present
    env: dev
    location: eastus
    workload: app

    resource_group: "rg-{{ workload }}-{{ env }}"
    vnet_name: "vnet-{{ workload }}-{{ env }}"
    vnet_cidr: ["10.50.0.0/16"]

    subnets:
      - name: snet-app
        cidr: 10.50.1.0/24
        service_endpoints: ["Microsoft.Storage", "Microsoft.KeyVault"]
      - name: snet-data
        cidr: 10.50.2.0/24
        service_endpoints: ["Microsoft.Storage"]

    # No public ingress by default. Adding any is a visible change to the spec.
    management_cidrs: ["10.0.0.0/8"]
    allow_public_ingress: false

    storage_account_name: "st{{ workload }}{{ env }}{{ 999 | random(seed=workload ~ env) }}"
    storage_sku: Standard_LRS
    storage_containers:
      - name: data
        access: private
    storage_allow_public_blob: false
    storage_min_tls: TLS1_2

    key_vault_name: "kv-{{ workload }}-{{ env }}"
    create_key_vault: true

    virtual_machines: []
    vm_size: Standard_D4s_v5
    admin_user: cloudops
    admin_ssh_key_file: "~/.ssh/id_ed25519.pub"

    log_analytics_workspace: "law-{{ workload }}-{{ env }}"
    enable_diagnostics: true

    common_tags:
      environment: "{{ env }}"
      workload: "{{ workload }}"
      managed_by: ansible
      owner: "{{ owner | default('cloud-platform') }}"
      cost_center: "{{ cost_center | default('unassigned') }}"

  tasks:
    # ---------------------------------------------------------------- validate
    - name: Validate the spec before creating anything
      ansible.builtin.assert:
        that:
          - env in ['dev', 'test', 'stage', 'prod']
          - workload | length >= 2
          - workload | length <= 12
          - storage_account_name | length <= 24
          - storage_account_name is match('^[a-z0-9]+$')
          - management_cidrs | length > 0
          - subnets | length > 0
        fail_msg: >-
          Spec is invalid. env must be dev/test/stage/prod; storage_account_name must
          be <=24 lowercase alphanumeric characters; management_cidrs must be set.
        quiet: true

    - name: Require justification for public ingress
      ansible.builtin.assert:
        that: public_ingress_justification is defined
        fail_msg: >-
          allow_public_ingress=true requires -e public_ingress_justification="..."
          so the reason is recorded in the run and in code review.
      when: allow_public_ingress | bool

    - name: Refuse to tear down a production stack without an explicit confirmation
      ansible.builtin.assert:
        that: confirm_destroy | default('') == resource_group
        fail_msg: >-
          To delete {{ resource_group }}, pass -e confirm_destroy={{ resource_group }}.
      when:
        - state == 'absent'
        - env == 'prod'

    # ------------------------------------------------------------------ delete
    - name: Delete the whole stack
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}"
        state: absent
        force_delete_nonempty: true
      when: state == 'absent'

    - name: Stop after teardown
      ansible.builtin.meta: end_play
      when: state == 'absent'

    # ------------------------------------------------------- resource group
    - name: Create the resource group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}"
        location: "{{ location }}"
        tags: "{{ common_tags }}"

    - name: Create the Log Analytics workspace
      azure.azcollection.azure_rm_loganalyticsworkspace:
        resource_group: "{{ resource_group }}"
        name: "{{ log_analytics_workspace }}"
        location: "{{ location }}"
        retention_in_days: "{{ log_retention_days | default(90) }}"
        tags: "{{ common_tags }}"
      register: law
      when: enable_diagnostics | bool

    # ------------------------------------------------------------- networking
    - name: Create the virtual network
      azure.azcollection.azure_rm_virtualnetwork:
        resource_group: "{{ resource_group }}"
        name: "{{ vnet_name }}"
        address_prefixes: "{{ vnet_cidr }}"
        tags: "{{ common_tags }}"

    - name: Create a network security group per subnet
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}"
        name: "nsg-{{ item.name }}"
        tags: "{{ common_tags }}"
        purge_rules: true
        rules: >-
          {{
            [
              {
                'name': 'allow-management-ssh',
                'protocol': 'Tcp',
                'source_address_prefix': management_cidrs,
                'destination_port_range': '22',
                'access': 'Allow',
                'priority': 100,
                'direction': 'Inbound'
              },
              {
                'name': 'allow-vnet-inbound',
                'protocol': '*',
                'source_address_prefix': 'VirtualNetwork',
                'destination_port_range': '*',
                'access': 'Allow',
                'priority': 200,
                'direction': 'Inbound'
              }
            ]
            + ([{
                'name': 'allow-https-public',
                'protocol': 'Tcp',
                'source_address_prefix': 'Internet',
                'destination_port_range': '443',
                'access': 'Allow',
                'priority': 300,
                'direction': 'Inbound'
              }] if (allow_public_ingress | bool) and item.name == 'snet-app' else [])
            + [
              {
                'name': 'deny-all-inbound',
                'protocol': '*',
                'source_address_prefix': '*',
                'destination_port_range': '*',
                'access': 'Deny',
                'priority': 4096,
                'direction': 'Inbound'
              }
            ]
          }}
      loop: "{{ subnets }}"
      loop_control:
        label: "nsg-{{ item.name }}"

    - name: Create the subnets
      azure.azcollection.azure_rm_subnet:
        resource_group: "{{ resource_group }}"
        virtual_network: "{{ vnet_name }}"
        name: "{{ item.name }}"
        address_prefix: "{{ item.cidr }}"
        security_group: "nsg-{{ item.name }}"
        service_endpoints: >-
          {{ item.service_endpoints | default([]) | map('community.general.dict_kv', 'service')
             | list if item.service_endpoints is defined else omit }}
      loop: "{{ subnets }}"
      loop_control:
        label: "{{ item.name }}"

    # ---------------------------------------------------------------- storage
    - name: Create the storage account
      azure.azcollection.azure_rm_storageaccount:
        resource_group: "{{ resource_group }}"
        name: "{{ storage_account_name }}"
        account_type: "{{ storage_sku }}"
        kind: StorageV2
        access_tier: Hot
        https_only: true
        minimum_tls_version: "{{ storage_min_tls }}"
        allow_blob_public_access: "{{ storage_allow_public_blob | bool }}"
        public_network_access: >-
          {{ 'Enabled' if (storage_public_network | default(false) | bool) else 'Disabled' }}
        network_acls:
          default_action: Deny
          bypass: AzureServices
          virtual_network_rules: >-
            {{ subnets | map(attribute='name')
               | map('regex_replace', '^(.*)$',
                     '/subscriptions/' ~ (subscription_id | default('')) ~
                     '/resourceGroups/' ~ resource_group ~
                     '/providers/Microsoft.Network/virtualNetworks/' ~ vnet_name ~
                     '/subnets/\\1')
               | map('community.general.dict_kv', 'id') | list }}
          ip_rules: >-
            {{ management_cidrs | map('community.general.dict_kv', 'value') | list }}
        blob_cors: []
        tags: "{{ common_tags }}"
      register: storage

    - name: Create the blob containers
      azure.azcollection.azure_rm_storageblob:
        resource_group: "{{ resource_group }}"
        storage_account_name: "{{ storage_account_name }}"
        container: "{{ item.name }}"
        public_access: "{{ item.access | default('private') }}"
      loop: "{{ storage_containers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert no container was created with public access
      ansible.builtin.assert:
        that:
          - storage_containers | rejectattr('access', 'undefined')
            | selectattr('access', 'ne', 'private') | list | length == 0
            or (storage_allow_public_blob | bool)
        fail_msg: >-
          A container requests non-private access but storage_allow_public_blob is
          false. Set it explicitly in the spec if that is genuinely intended.
        success_msg: "All blob containers are private"

    # -------------------------------------------------------------- key vault
    - name: Create the key vault
      azure.azcollection.azure_rm_keyvault:
        resource_group: "{{ resource_group }}"
        vault_name: "{{ key_vault_name }}"
        location: "{{ location }}"
        enabled_for_disk_encryption: true
        enable_soft_delete: true
        soft_delete_retention_in_days: "{{ kv_retention_days | default(90) }}"
        enable_purge_protection: "{{ (env == 'prod') | bool }}"
        enable_rbac_authorization: true
        sku: standard
        network_acls:
          default_action: Deny
          bypass: AzureServices
        tags: "{{ common_tags }}"
      when: create_key_vault | bool

    # -------------------------------------------------------------------- VMs
    - name: Create the network interfaces
      azure.azcollection.azure_rm_networkinterface:
        resource_group: "{{ resource_group }}"
        name: "nic-{{ item.name }}"
        virtual_network: "{{ vnet_name }}"
        subnet_name: "{{ item.subnet | default(subnets[0].name) }}"
        security_group: "nsg-{{ item.subnet | default(subnets[0].name) }}"
        create_with_security_group: false
        ip_configurations:
          - name: ipconfig1
            private_ip_allocation_method: Dynamic
            public_ip_address_name: ""
        tags: "{{ common_tags }}"
      loop: "{{ virtual_machines }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create the virtual machines
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: "{{ resource_group }}"
        name: "{{ item.name }}"
        vm_size: "{{ item.size | default(vm_size) }}"
        admin_username: "{{ admin_user }}"
        ssh_password_enabled: false
        ssh_public_keys:
          - path: "/home/{{ admin_user }}/.ssh/authorized_keys"
            key_data: "{{ lookup('file', admin_ssh_key_file) }}"
        managed_disk_type: Premium_LRS
        os_disk_size_gb: "{{ item.os_disk_gb | default(128) }}"
        data_disks: "{{ item.data_disks | default([]) }}"
        network_interfaces: "nic-{{ item.name }}"
        boot_diagnostics:
          enabled: true
        managed_identity:
          type: SystemAssigned
        image:
          offer: "0001-com-ubuntu-server-jammy"
          publisher: Canonical
          sku: "22_04-lts-gen2"
          version: latest
        tags: "{{ common_tags | combine(item.tags | default({})) }}"
      loop: "{{ virtual_machines }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install the Azure Monitor agent on every VM
      azure.azcollection.azure_rm_virtualmachineextension:
        resource_group: "{{ resource_group }}"
        virtual_machine_name: "{{ item.name }}"
        name: AzureMonitorLinuxAgent
        publisher: Microsoft.Azure.Monitor
        virtual_machine_extension_type: AzureMonitorLinuxAgent
        type_handler_version: "1.0"
        auto_upgrade_minor_version: true
      loop: "{{ virtual_machines }}"
      loop_control:
        label: "{{ item.name }}"
      when: enable_diagnostics | bool

    # ---------------------------------------------------------------- verify
    - name: Confirm no VM was given a public IP
      azure.azcollection.azure_rm_publicipaddress_info:
        resource_group: "{{ resource_group }}"
      register: public_ips

    - name: Assert the stack has no unexpected public exposure
      ansible.builtin.assert:
        that:
          - (public_ips.publicipaddresses | default([]) | length) == 0
            or (allow_public_ingress | bool)
        fail_msg: >-
          {{ public_ips.publicipaddresses | default([]) | length }} public IP(s) exist in
          {{ resource_group }} but allow_public_ingress is false.
        success_msg: "No unexpected public IPs in {{ resource_group }}"

    - name: Summarise what was created
      ansible.builtin.debug:
        msg: >-
          {{ resource_group }} in {{ location }}:
          vnet {{ vnet_name }} with {{ subnets | length }} subnet(s),
          storage {{ storage_account_name }} ({{ storage_sku }}, TLS {{ storage_min_tls }},
          public blob {{ storage_allow_public_blob }}),
          {{ virtual_machines | length }} VM(s),
          key vault {{ key_vault_name if create_key_vault | bool else 'not created' }},
          diagnostics {{ 'to ' ~ log_analytics_workspace if enable_diagnostics | bool else 'disabled' }}
