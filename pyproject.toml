[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # Operational scripts deliberately catch broad exceptions so that one bad
    # host or one restricted subscription cannot abort a fleet-wide run; each
    # site carries a noqa explaining why.
    "B904",
    # Long, deliberately formatted help/report strings.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# The scripts import their sibling helper module by bare name, which is correct
# when they are executed directly from their own directory.
"**/common.py" = ["F401"]
