---
name: lint

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Byte-compile every script
        run: |
          python -m compileall -q \
            openstack/python azure/python azure/operator-nexus/python \
            storage/python kubernetes/python security/python network/python

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the real SDKs
        # The tests build genuine openstacksdk and azure-mgmt model objects, so
        # they fail when an SDK renames a field or changes model shape; the
        # breakage that otherwise shows up as an empty report against a live
        # cloud rather than as a test failure here.
        run: |
          pip install pytest
          pip install openstacksdk azure-identity azure-mgmt-networkcloud

      - name: Run tests
        run: pytest tests/ -q

  desi-nexus:
    name: DESI-NEXUS API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desi-nexus/services/api

    services:
      # PostGIS, not plain Postgres: the schema stores venues and home bases as
      # geography(Point) and the migrations will not apply without it.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: desi_nexus
          POSTGRES_PASSWORD: desi_nexus_ci
          POSTGRES_DB: desi_nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desi_nexus -d desi_nexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # The rate limiter's buckets live in Redis, and the tests that prove they
      # are shared across replicas need a real one.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Set, so the database-backed tests actually run here. Without it they
      # skip, which would let a broken repository layer go green.
      DESI_NEXUS_TEST_DATABASE_URL: >-
        postgresql://desi_nexus:desi_nexus_ci@localhost:5432/desi_nexus_test
      DESI_NEXUS_TEST_REDIS_URL: redis://localhost:6379/9

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck and test
        # The build is part of the test script: the suite runs against the
        # compiled output, so a type error fails here rather than at runtime.
        #
        # The skip check matters as much as the pass count: the database and
        # Redis tests skip themselves when their service is not configured, and
        # a skipped suite still reports success -- so a misconfigured service
        # would quietly stop covering the repository or rate-limiting layer
        # while CI stayed green.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          skipped=$(awk '/^# skipped/ {print $3; exit}' test-output.txt)
          echo "skipped: ${skipped:-unknown}"
          if [ "${skipped:-1}" != "0" ]; then
            echo "::error::service-backed tests were skipped; check the postgres and redis services"
            exit 1
          fi

  desi-nexus-web:
    name: DESI-NEXUS Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desi-nexus/apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # A production build type-checks every route and catches the
        # server/client boundary mistakes that only appear when React tries to
        # serialise across it -- a plain tsc pass does not see those.
        run: npm run build
  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ansible-core ansible-lint yamllint

      - name: yamllint
        run: yamllint .

      - name: Install required collections
        run: |
          ansible-galaxy collection install \
            kubernetes.core ansible.posix community.general community.crypto \
            openstack.cloud azure.azcollection

      - name: Syntax-check every playbook
        run: |
          set -e
          # Each playbook directory carries its own ansible.cfg (roles_path for
          # the shared role, inventory defaults), and ansible only reads the
          # cfg in the working directory; so check each one from its own
          # directory, exactly as these are run in practice.
          repo="$PWD"
          for dir in openstack/ansible azure/ansible azure/operator-nexus/ansible \
                     kubernetes/ansible security/ansible hardware/ansible; do
            cd "$repo/$dir"
            for playbook in *.yml; do
              echo "==> $dir/$playbook"
              ansible-playbook --syntax-check -i localhost, "$playbook"
            done
          done

      - name: ansible-lint
        run: ansible-lint || true   # advisory until every site-specific rule is tuned

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on committed credentials
        run: |
          set +e
          # This job's own pattern definition would otherwise match itself.
          key='BEGIN [A-Z ]*PRIVATE KEY'
          envs='(OS_PASSWORD|AZURE_CLIENT_SECRET|PURE_API_TOKEN|S1_API_TOKEN)=.+'
          literal='client_secret"?[[:space:]]*[:=][[:space:]]*[^$[:space:]]+'
          pattern="($key|$envs|$literal)"
          matches=$(grep -rInE "$pattern" \
            --exclude-dir=.git \
            --exclude-dir=.github \
            . )
          if [ -n "$matches" ]; then
            echo "Possible credential material committed:"
            echo "$matches"
            exit 1
          fi
          echo "No credential patterns found."
