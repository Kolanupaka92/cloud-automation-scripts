---
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Byte-compile every script
        run: |
          python -m compileall -q \
            openstack/python azure/python azure/operator-nexus/python \
            storage/python kubernetes/python security/python network/python

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ansible-core ansible-lint yamllint

      - name: yamllint
        run: yamllint .

      - name: Install required collections
        run: |
          ansible-galaxy collection install \
            kubernetes.core ansible.posix community.general community.crypto \
            openstack.cloud azure.azcollection

      - name: Syntax-check every playbook
        run: |
          set -e
          # Each playbook directory carries its own ansible.cfg (roles_path for
          # the shared role, inventory defaults), and ansible only reads the
          # cfg in the working directory — so check each one from its own
          # directory, exactly as these are run in practice.
          repo="$PWD"
          for dir in openstack/ansible azure/ansible azure/operator-nexus/ansible \
                     kubernetes/ansible security/ansible hardware/ansible; do
            cd "$repo/$dir"
            for playbook in *.yml; do
              echo "==> $dir/$playbook"
              ansible-playbook --syntax-check -i localhost, "$playbook"
            done
          done

      - name: ansible-lint
        run: ansible-lint || true   # advisory until every site-specific rule is tuned

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on committed credentials
        run: |
          set +e
          # This job's own pattern definition would otherwise match itself.
          pattern='(BEGIN [A-Z ]*PRIVATE KEY|OS_PASSWORD=.+|AZURE_CLIENT_SECRET=.+|client_secret"?[[:space:]]*[:=][[:space:]]*[^$[:space:]]+)'
          matches=$(grep -rInE "$pattern" \
            --exclude-dir=.git \
            --exclude-dir=.github \
            . )
          if [ -n "$matches" ]; then
            echo "Possible credential material committed:"
            echo "$matches"
            exit 1
          fi
          echo "No credential patterns found."
