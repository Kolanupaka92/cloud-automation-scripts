---
- name: Reload sshd
  ansible.builtin.service:
    name: sshd
    state: reloaded

- name: Restart auditd
  # auditd refuses a systemd restart on RHEL derivatives ("Operation refused,
  # unit auditd.service may be requested by dependency only"), so the SysV
  # wrapper is the only thing that works here. noqa is deliberate, not laziness.
  ansible.builtin.command: service auditd restart  # noqa: command-instead-of-module
  changed_when: true
