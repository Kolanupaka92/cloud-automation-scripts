; Example inventory for a single OpenStack region.
; Copy to inventory.ini and adjust; inventory.ini is gitignored.

[controllers]
ctrl-01 ansible_host=10.20.0.11
ctrl-02 ansible_host=10.20.0.12
ctrl-03 ansible_host=10.20.0.13

[computes]
compute-[001:048] ansible_host_template=10.20.1.%d

[network]
net-01 ansible_host=10.20.0.21
net-02 ansible_host=10.20.0.22

[storage]
ceph-mon-[01:03]

[openstack:children]
controllers
computes
network
storage

[openstack:vars]
ansible_user=cloud-ops
region_name=dfw-prod
; Anything sensitive lives in an Ansible Vault file, never here:
;   ansible-vault create group_vars/openstack/vault.yml
