[defaults]
inventory            = inventory.example.ini
roles_path           = roles:../../common/ansible/roles
host_key_checking    = True
retry_files_enabled  = False
stdout_callback      = yaml
callbacks_enabled    = profile_tasks, timer
forks                = 25
interpreter_python   = auto_silent
# Fact caching keeps repeated runs across a 3,000-node estate cheap.
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout = 3600

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
