# Repository-root defaults.
#
# Each playbook directory carries its own ansible.cfg for day-to-day use (they
# set the right inventory and fact caching for that platform). This root file
# exists so tooling run from the repository root (ansible-lint, CI, an IDE)
# can still resolve the shared role in common/ansible/roles.
[defaults]
roles_path         = common/ansible/roles
interpreter_python = auto_silent
stdout_callback    = yaml
